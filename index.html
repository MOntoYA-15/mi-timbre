<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Timbre v8.8</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #dc2626; 
            --success: #16a34a; 
            --bg: #f1f5f9; 
            --slate: #64748b;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }

        .container { width: 100%; max-width: 450px; padding: 20px; }
        
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 15px rgba(0,0,0,0.1); 
        }

        h2, h4 { margin-top: 0; color: #1e293b; text-align: center; }

        /* Estado de Conexión */
        #online-status {
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .online { color: var(--success); background: #dcfce7; border: 1px solid #bbf7d0; }
        .offline { color: var(--danger); background: #fee2e2; border: 1px solid #fecaca; }

        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem; 
        }

        .btn { 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            color: white; 
            width: 100%; 
            transition: 0.2s; 
            margin-top: 10px; 
        }
        .btn:active { transform: scale(0.97); }

        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        .btn-logout { background: var(--slate); font-size: 0.8rem; width: auto; padding: 5px 15px; }

        .hidden { display: none; }
        
        /* Lista de horarios */
        .toque-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px; 
            border-bottom: 1px solid #f1f5f9; 
        }
        
        .actions { display: flex; gap: 8px; }
        .btn-action { background: none; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; padding: 5px; }
        
        #status-sync { font-size: 0.7rem; text-align: center; color: var(--slate); margin-top: 12px; }
        #error-msg { color: var(--danger); font-size: 0.85rem; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-box" class="card">
        <h2>Acceso Timbre</h2>
        <div id="error-msg"></div>
        <input type="email" id="user-email" placeholder="Correo">
        <input type="password" id="user-pass" placeholder="Contraseña">
        <button class="btn btn-blue" onclick="handleLogin()">Entrar</button>
    </div>

    <div id="panel-box" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button class="btn btn-logout" onclick="handleLogout()">Cerrar Sesión</button>
            <span style="font-size: 0.8rem; color: var(--slate);">Sistema v8.8</span>
        </div>

        <div id="online-status" class="offline">VERIFICANDO ESP32...</div>

        <button id="btn-maestro" class="btn" onclick="toggleMaestro()">Cargando...</button>

        <div style="margin: 20px 0;">
            <h4>Horarios Guardados</h4>
            <div id="lista-toques" style="max-height: 220px; overflow-y: auto; border: 1px solid #f1f5f9; border-radius: 8px;"></div>
        </div>

        <input type="time" id="nuevo-horario">
        <button class="btn btn-green" onclick="addTime()">+ Guardar Horario</button>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
            <button class="btn btn-red" onclick="manualRing()">Toque Manual</button>
            <button class="btn btn-blue" style="background: #8b5cf6;" onclick="syncSystem()">Sincronizar</button>
        </div>
        
        <div id="status-sync">Esperando acción...</div>
    </div>
</div>

<script>
    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyAbTb-cXeJmmPprRaVTqSyBiEyoEGv93f0",
        authDomain: "sistematimbre.firebaseapp.com",
        databaseURL: "https://sistematimbre-default-rtdb.firebaseio.com",
        projectId: "sistematimbre"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let estadoMaestro = true;

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('panel-box').classList.remove('hidden');
            startListening();
        } else {
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('panel-box').classList.add('hidden');
        }
    });

    function handleLogin() {
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-pass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(err => {
            document.getElementById('error-msg').innerText = "Error de acceso";
        });
    }

    function handleLogout() { auth.signOut(); }

    function startListening() {
        // Escuchar Estado Maestro
        db.ref('estado_maestro').on('value', snapshot => {
            estadoMaestro = snapshot.val() !== false;
            const btn = document.getElementById('btn-maestro');
            btn.innerText = estadoMaestro ? "SISTEMA ACTIVADO" : "SISTEMA PAUSADO";
            btn.className = estadoMaestro ? "btn btn-green" : "btn btn-red";
        });

        // Escuchar Horarios
        db.ref('timbres').on('value', snapshot => {
            const listDiv = document.getElementById('lista-toques');
            listDiv.innerHTML = '';
            if (!snapshot.exists()) {
                listDiv.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:10px;">No hay horarios</p>';
                return;
            }
            snapshot.forEach(child => {
                const t = child.val();
                const timeStr = `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`;
                listDiv.innerHTML += `
                    <div class="toque-item" id="item-${child.key}">
                        <span><b>${timeStr}</b></span>
                        <div class="actions">
                            <button class="btn-action" style="color:var(--primary);" onclick="showEditForm('${child.key}', '${timeStr}')">EDITAR</button>
                            <button class="btn-action" style="color:var(--danger);" onclick="deleteTime('${child.key}')">BORRAR</button>
                        </div>
                    </div>`;
            });
        });

        // Heartbeat (Detección de ESP32 en línea)
        db.ref('ultima_conexion').on('value', snapshot => {
            const statusDiv = document.getElementById('online-status');
            const lastTime = snapshot.val();
            const updateUI = () => {
                const diff = (Date.now() - lastTime) / 1000;
                if (diff < 40) {
                    statusDiv.innerText = "DISPOSITIVO: EN LÍNEA";
                    statusDiv.className = "online";
                } else {
                    statusDiv.innerText = "🔌 DISPOSITIVO: FUERA DE LÍNEA";
                    statusDiv.className = "offline";
                }
            };
            if (lastTime) updateUI();
            if (window.hbTimer) clearInterval(window.hbTimer);
            window.hbTimer = setInterval(updateUI, 10000);
        });
    }

    function forceESP32Update() {
        const ahora = Date.now();
        // 1. Sincronizar Reloj
        db.ref('comando_hora').set({ timestamp: ahora });
        
        // 2. ACTIVAR SEÑAL DE ALERTA PARA EL ESP32
        db.ref('update_pending').set(true);
        
        document.getElementById('status-sync').innerText = "Sincronizando con ESP32...";
        setTimeout(() => {
            document.getElementById('status-sync').innerText = "Cambios enviados.";
        }, 3000);
    }

    function toggleMaestro() { db.ref('estado_maestro').set(!estadoMaestro); }

    function addTime() {
        const val = document.getElementById('nuevo-horario').value;
        if (!val) return;
        const [h, m] = val.split(':').map(Number);
        db.ref('timbres').push({ h, m }).then(() => {
            forceESP32Update();
            document.getElementById('nuevo-horario').value = "";
        });
    }

    function deleteTime(id) {
        if (confirm("¿Borrar horario?")) {
            db.ref('timbres/' + id).remove().then(() => forceESP32Update());
        }
    }

    function showEditForm(id, currentTime) {
        const item = document.getElementById(`item-${id}`);
        item.innerHTML = `
            <input type="time" id="edit-${id}" style="width:120px; margin:0;" value="${currentTime}">
            <div class="actions">
                <button class="btn-action" style="color:var(--success);" onclick="saveEdit('${id}')">OK</button>
                <button class="btn-action" style="color:var(--slate);" onclick="startListening()">X</button>
            </div>`;
    }

    function saveEdit(id) {
        const newVal = document.getElementById(`edit-${id}`).value;
        if (!newVal) return;
        const [h, m] = newVal.split(':').map(Number);
        db.ref('timbres/' + id).update({ h, m }).then(() => forceESP32Update());
    }

    function manualRing() { 
        db.ref('manual').set(true); 
        alert("Toque manual enviado");
    }

    function syncSystem() {
        forceESP32Update();
    }
</script>
</body>
</html>
