<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Timbre - Acceso Restringido</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Estilos del Login */
        #login-section { margin-top: 50px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        
        /* Botones */
        .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; width: 100%; margin: 5px 0; }
        .btn-blue { background: var(--primary); }
        .btn-red { background: var(--danger); }
        .btn-green { background: var(--success); }
        .btn-logout { background: #64748b; margin-top: 20px; }

        .hidden { display: none; }
        .toque-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section" class="card">
        <h2>🔐 Acceso al Sistema</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button class="btn btn-blue" onclick="login()">Iniciar Sesión</button>
        <p id="login-error" style="color: red; font-size: 0.9rem;"></p>
    </div>

    <div id="control-section" class="hidden">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🔔 Panel de Control</h3>
                <button class="btn btn-logout" onclick="logout()" style="width:auto; padding:5px 10px;">Cerrar</button>
            </div>
            <div id="lista-toques"></div>
        </div>

        <div class="card">
            <h3>⚙️ Configuración</h3>
            <input type="time" id="nuevo-horario">
            <button class="btn btn-green" onclick="agregarToque()">+ Agregar Toque</button>
            <button class="btn btn-red" onclick="toqueManual()">🔔 Toque Manual</button>
            <button class="btn btn-blue" onclick="sincronizarHora()">🕒 Sincronizar RTC</button>
        </div>
    </div>
</div>

<script>
    // CONFIGURACIÓN (Usa tus datos reales aquí)
    const firebaseConfig = {
        apiKey: "TU_API_KEY_AQUÍ", // La encuentras en Configuración del Proyecto
        databaseURL: "https://sistematimbre-default-rtdb.firebaseio.com/",
        projectId: "sistematimbre-default",
        authDomain: "sistematimbre-default.firebaseapp.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // 1. GESTIÓN DE SESIÓN
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('control-section').classList.remove('hidden');
            cargarDatos();
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('control-section').classList.add('hidden');
        }
    });

    function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, pass).catch(error => {
            document.getElementById('login-error').innerText = "Acceso denegado: " + error.message;
        });
    }

    function logout() { auth.signOut(); }

    // 2. FUNCIONES DEL TIMBRE
    function cargarDatos() {
        db.ref('timbres').on('value', snapshot => {
            const lista = document.getElementById('lista-toques');
            lista.innerHTML = '';
            snapshot.forEach(child => {
                const t = child.val();
                lista.innerHTML += `
                    <div class="toque-item">
                        <span>${t.h}:${t.m}</span>
                        <button onclick="eliminarToque('${child.key}')" style="color:red; border:none; background:none; cursor:pointer;">Eliminar</button>
                    </div>`;
            });
        });
    }

    function agregarToque() {
        const val = document.getElementById('nuevo-horario').value;
        if (!val) return;
        const [h, m] = val.split(':').map(Number);
        db.ref('timbres').push({ h, m });
    }

    function toqueManual() {
        db.ref('manual').set(true).then(() => {
            setTimeout(() => db.ref('manual').set(false), 2000);
        });
    }

    function sincronizarHora() {
        const n = new Date();
        db.ref('comando_hora').set({ h: n.getHours(), m: n.getMinutes(), s: n.getSeconds(), d: n.getDate(), mes: n.getMonth()+1, a: n.getFullYear() });
        alert("Hora enviada");
    }

    function eliminarToque(id) { if(confirm('¿Eliminar?')) db.ref('timbres/'+id).remove(); }
</script>
</body>
</html>
