<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Timbre Escolar - Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .row:last-child { border-bottom: none; }
        input[type="time"] { padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-save:hover { background-color: #218838; }
        .btn-manual { background-color: #dc3545; color: white; }
        .btn-manual:hover { background-color: #c82333; }
        .status { margin-top: 10px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔔 Programación de Timbres</h2>
        <div id="horarios-list"></div>
        <button class="btn btn-save" onclick="guardarConfiguracion()">💾 GUARDAR CAMBIOS</button>
        <button class="btn btn-manual" onclick="activarManual()">🔔 TOQUE MANUAL INMEDIATO</button>
        <div id="status" class="status">Cargando datos...</div>
    </div>

    <script>
        // Tu configuración de Firebase
        const firebaseConfig = { databaseURL: "https://sistematimbre-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Generar los 20 campos de entrada
        const listDiv = document.getElementById('horarios-list');
        for (let i = 0; i < 20; i++) {
            listDiv.innerHTML += `
                <div class="row">
                    <span><b>Toque ${i + 1}:</b></span>
                    <input type="time" id="t_${i}" value="00:00">
                    <input type="checkbox" id="a_${i}">
                </div>`;
        }

        // Leer datos actuales de Firebase
        db.ref('timbres').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                data.forEach((item, i) => {
                    document.getElementById(`t_${i}`).value = `${String(item.h).padStart(2, '0')}:${String(item.m).padStart(2, '0')}`;
                    document.getElementById(`a_${i}`).checked = item.act;
                });
                document.getElementById('status').innerText = "Sincronizado con Firebase";
            }
        });

        function guardarConfiguracion() {
            let data = [];
            for (let i = 0; i < 20; i++) {
                let timeParts = document.getElementById(`t_${i}`).value.split(':');
                data.push({
                    h: parseInt(timeParts[0]),
                    m: parseInt(timeParts[1]),
                    act: document.getElementById(`a_${i}`).checked
                });
            }
            db.ref('timbres').set(data).then(() => alert("✅ ¡Horarios actualizados en la nube!"));
        }

        function activarManual() {
            db.ref('manual').set(true).then(() => {
                setTimeout(() => db.ref('manual').set(false), 2000);
            });
        }
    </script>
</body>
</html>
