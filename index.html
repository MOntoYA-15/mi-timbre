<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Acceso Protegido</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #1e293b; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        .btn-logout { background: #64748b; font-size: 0.8rem; width: auto; padding: 5px 15px; }
        .hidden { display: none; }
        .toque-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; font-weight: bold; }
        #error-msg { color: var(--danger); font-size: 0.85rem; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-box" class="card">
        <h2>🔒 Timbre Inteligente</h2>
        <p style="text-align: center; color: #64748b;">Ingrese credenciales de administrador</p>
        <div id="error-msg"></div>
        <input type="email" id="user-email" placeholder="Correo electrónico">
        <input type="password" id="user-pass" placeholder="Contraseña">
        <button class="btn btn-blue" onclick="handleLogin()">Entrar al Panel</button>
    </div>

    <div id="panel-box" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>⚙️ Panel de Control</h3>
            <button class="btn btn-logout" onclick="handleLogout()">Cerrar Sesión</button>
        </div>
        
        <div id="lista-toques" style="margin: 20px 0; max-height: 200px; overflow-y: auto;">
            </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        
        <input type="time" id="nuevo-horario">
        <button class="btn btn-green" onclick="addTime()">+ Agregar Horario</button>
        <button class="btn btn-red" onclick="manualRing()">🔔 Toque Manual</button>
        <button class="btn btn-blue" style="background: #8b5cf6;" onclick="syncRTC()">🕒 Sincronizar Reloj</button>
    </div>
</div>

<script>
    // TUS CREDENCIALES REALES
    const firebaseConfig = {
        apiKey: "AIzaSyAbTb-cXeJmmPprRaVTqSyBiEyoEGv93f0",
        authDomain: "sistematimbre.firebaseapp.com",
        databaseURL: "https://sistematimbre-default-rtdb.firebaseio.com",
        projectId: "sistematimbre"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Vigilar el estado de la sesión
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('panel-box').classList.remove('hidden');
            startListening();
        } else {
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('panel-box').classList.add('hidden');
        }
    });

    function handleLogin() {
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-pass').value;
        const errorDiv = document.getElementById('error-msg');

        auth.signInWithEmailAndPassword(email, pass).catch(error => {
            errorDiv.innerText = "Error: Usuario o clave incorrectos";
        });
    }

    function handleLogout() { auth.signOut(); }

    function startListening() {
        db.ref('timbres').on('value', snapshot => {
            const listDiv = document.getElementById('lista-toques');
            listDiv.innerHTML = '';
            if (!snapshot.exists()) {
                listDiv.innerHTML = '<p style="color: #94a3b8; text-align: center;">No hay horarios</p>';
                return;
            }
            snapshot.forEach(child => {
                const t = child.val();
                listDiv.innerHTML += `
                    <div class="toque-item">
                        <span>${t.h.toString().padStart(2,'0')}:${t.m.toString().padStart(2,'0')}</span>
                        <button onclick="deleteTime('${child.key}')" style="color:red; background:none; border:none; cursor:pointer;">✖</button>
                    </div>`;
            });
        });
    }

    function addTime() {
        const timeVal = document.getElementById('nuevo-horario').value;
        if (!timeVal) return;
        const [h, m] = timeVal.split(':').map(Number);
        db.ref('timbres').push({ h, m });
    }

    function deleteTime(id) {
        if (confirm("¿Eliminar este horario?")) db.ref('timbres/' + id).remove();
    }

    function manualRing() {
        db.ref('manual').set(true); // El ESP32 lo regresará a false
    }

    function syncRTC() {
        const d = new Date();
        db.ref('comando_hora').set({
            h: d.getHours(), m: d.getMinutes(), s: d.getSeconds(),
            d: d.getDate(), mes: d.getMonth() + 1, a: d.getFullYear()
        });
        alert("Comando de hora enviado");
    }
</script>
</body>
</html>
